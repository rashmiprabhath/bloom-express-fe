<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomExpress</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"rel="stylesheet">
</head>
<body>
    <div class="navbar-container">
        <h1>Bloom<span class="highlight">Express</span></h1>
        <ul class="menu-item-list">
            <li><a href="/api/v1/health">Shop</a></li>
            <li><a href="/api/v1/generate">About</a></li>
        </ul>
    </div>
    <div class="action-container">
        <div class="category-container">
            <ul class="main-category">
                <li class="main-category-item"><a href="/api/v1/health">All</a></li>
                <li class="main-category-item"><a href="/api/v1/generate">Features</a></li>
                <li class="main-category-item"><a href="/api/v1/generate">Men</a></li>
                <li class="main-category-item"><a href="/api/v1/generate">Women</a></li>
                <li class="main-category-item"><a href="/api/v1/generate">Dining and Restaurent</a></li>
            </ul>
        </div>
        <div class="searchbar-container">
            <input type="text" placeholder="Search for shops, brands and more..." class="searchbar"/>
        </div>
    </div>
    <div>
        <p class="category-title">Featured</p>
        <div class="main-grid-container">
            <ul class="shop-list">
                <li><a target="_blank" href="https://mimosaforever.com/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/mimosa.webp" alt="Mimosa"/> 
                        <p>Mimosa</p> 
                    </div>
                </a></li>
                <li><a target="_blank" href="https://www.simplytek.lk/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/simplytek.webp" alt="SimplyTek" />
                    </div>
                    SimplyTek
                </a></li>
                <li><a target="_blank" href="https://lk.spaceylon.com/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/spaceylon.webp" alt="Spaceylon" />
                        <p>Spaceylon</p>
                    </div>
                </a></li>
                <li><a target="_blank" href="https://m.dominoslk.com/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/dominos.webp" alt="Dominos" />
                        <p>Dominos</p>
                    </div>
                </a></li>
                <li><a target="_blank" href="https://www.nike.com/lk/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/nike.webp" alt="Nike" />
                        <p>Nike</p>
                    </div>
                </a></li>
                <li><a target="_blank" href="https://www.nolimit.com/">
                    <div class="shop-card">
                        <img class="shop-image" src="assets/images/nolimit.webp" alt="Nolimit" />
                        <p>Nolimit</p>
                    </div>
                </a></li>
            </ul>
        </div>
    </div>

</body>
</html>
